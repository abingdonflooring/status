# Change these first
owner: abingdonflooring # Your GitHub organization or username, where this repository lives
repo: status # The name of this repository

# Default assignee(s) for every incident issue. GitHub emails the assignee
# automatically when an incident is opened/closed (the no-cost "email on down").
assignees:
  - abingdonflooring

sites:
  - name: Alliance Portal
    url: https://portal.alliancefdl.co.uk/alliance/
  # DISABLED 2026-05-19: real API at /wms is IP-firewalled — unreachable from
  # GitHub-hosted runners (code 0), so it always false-alerts "down". Re-enable
  # only with a reachable endpoint or a self-hosted runner inside the network.
  # - name: Alliance API
  #   url: $ALLAPI
  #   expectedStatusCodes:
  #     - 200
  #     - 401
  - name: Customer Portal
    url: https://portal.abingdonflooring.co.uk/
  - name: VPN
    url: https://VPN.abingdonflooring.co.uk
    # VPN gateways rarely return a clean 200 to a plain GET (login portal redirect /
    # auth challenge). Treat these as "up" so we don't get false outages like #216.
    expectedStatusCodes:
      - 200
      - 301
      - 302
      - 401
      - 403
    maxResponseTime: 10000
  - name: Customer Warranty registration
    url: https://stainfreeforlife.com/
  - name: AFL Homepage
    url: https://www.abingdonflooring.co.uk

status-website:
  theme: light  
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  #cname: demo.upptime.js.org
  baseUrl: /status
  logoUrl: https://www.abingdonflooring.co.uk/wp-content/uploads/xGroup-110.png.pagespeed.ic.hUVL0CdV38.png
  name: " "
  introTitle: "Service Status"
  introMessage: " "
  navbar:
    - title: Status
      href: /status/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  metaTags:
    - name: "robots"
      content: "noindex"
      
i18n:
  footer: Please contact the helpdesk if you have issues


